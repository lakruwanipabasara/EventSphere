{% extends "base.html" %}{% block title %}Register{% endblock %}
{% from "_macros.html" import csrf with context %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="panel">
<h1 class="h3 mb-3">Create an account</h1>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="/register">{{ csrf() }}
<label class="form-label" for="name">Full name</label>
<input class="form-control mb-3" id="name" name="name" value="{{ form.name or '' }}" required>
<label class="form-label" for="email">Email</label>
<input class="form-control mb-3" id="email" type="email" name="email" value="{{ form.email or '' }}" required>
<label class="form-label" for="password">Password (8 to 64 characters)</label>
<input class="form-control mb-3" id="password" type="password" name="password" minlength="8" maxlength="64" required autocomplete="new-password">
<button class="btn btn-teal w-100">Register</button></form>
</div></div></div>{% endblock %}
