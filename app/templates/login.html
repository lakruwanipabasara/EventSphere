{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% from "_macros.html" import csrf with context %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="panel">
<h1 class="h3 mb-3">Sign in</h1>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="/login">{{ csrf() }}<input type="hidden" name="next" value="{{ next }}">
<label class="form-label" for="email">Email</label>
<input class="form-control mb-3" id="email" type="email" name="email" value="{{ form.email or '' }}" required autocomplete="username">
<label class="form-label" for="password">Password</label>
<input class="form-control mb-3" id="password" type="password" name="password" required autocomplete="current-password">
<button class="btn btn-teal w-100">Sign in</button></form>
<p class="mt-3 mb-0 small">New here? <a href="/register">Create an attendee account</a></p>
</div></div></div>{% endblock %}
